services:
  caddy:
    image: caddy:2-alpine
    container_name: oci-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - oci-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: oci-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oci_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oci_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-oci_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oci_admin -d oci_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oci-network

  redis:
    image: redis:7-alpine
    container_name: oci-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password_2026} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oci-network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: oci-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-oci_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-oci_minio_secret_password_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - oci-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: oci-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: ${DATABASE_URL:-postgresql://oci_admin:oci_secure_password_2026@postgres:5432/oci_production?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://:redis_secure_password_2026@redis:6379}
      OCI_MASTER_ENCRYPTION_KEY: ${OCI_MASTER_ENCRYPTION_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oci-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: oci-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://oci_admin:oci_secure_password_2026@postgres:5432/oci_production?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://:redis_secure_password_2026@redis:6379}
      OCI_MASTER_ENCRYPTION_KEY: ${OCI_MASTER_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oci-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: oci-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: https://intelligence.omniastores.com/api/v1
    depends_on:
      - api
    networks:
      - oci-network

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  minio_data:

networks:
  oci-network:
    driver: bridge
