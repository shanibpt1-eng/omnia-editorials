# Public storefront (oci-platform/apps/web, port 3001)
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/omnia-proxy.conf;
    }

    # Internal pages/endpoints of the storefront that must not be public.
    location ~ ^/(backend|api/publish-article) {
        auth_basic "Omnia Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-omnia;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/omnia-proxy.conf;
    }
}

# Admin dashboard (repo root app, port 3000) - password protected
server {
    listen 80;
    server_name __ADMIN_DOMAIN__;

    # ZIP/HTML uploads via /api/publisher/upload-*
    client_max_body_size 100M;

    auth_basic "Omnia Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-omnia;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/omnia-proxy.conf;
    }
}
