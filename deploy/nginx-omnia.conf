server {
    listen 80;
    server_name __DOMAIN__;

    # ZIP/HTML uploads via /api/publisher/upload-*
    client_max_body_size 100M;

    # The dashboard and its /api routes have no login of their own,
    # so the whole site is protected with HTTP basic auth.
    auth_basic "Omnia Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-omnia;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
